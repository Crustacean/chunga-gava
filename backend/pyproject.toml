[project]
name = "chungagava-backend"
version = "0.1.0"
description = "Chunga Gava - Kenya civic transparency & accountability platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.5",
    "psycopg[binary]>=3.1.19",
    "pgvector>=0.3.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "pypdf>=4.3.0",
    "langchain-text-splitters>=0.2.2",
    "openai>=1.40.0",
    "boto3>=1.34.0",
    "apscheduler>=3.10.4",
    "africastalking>=1.2.9",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
